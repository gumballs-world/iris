[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-terminal-ai"
version = "0.1.0"
description = "Always-available terminal AI assistant with online/offline support"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "ollama>=0.3.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
]

[project.scripts]
iris = "iris.cli:main"
